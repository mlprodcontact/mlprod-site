<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Prod – Vidéaste mariage</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header class="nav">
    <a href="#accueil" class="logo">ML<span>Prod</span></a>
    <button class="burger" aria-label="Menu">☰</button>
    <nav class="menu">
      <a href="#accueil">Accueil</a>
      <a href="#galerie">Galerie</a>
      <a href="#apropos">À propos</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="accueil" class="hero">
    <video id="heroVideo" autoplay muted loop playsinline></video>
    <div class="hero-text">
      <h1 id="heroTitre"></h1>
      <p id="heroSlogan"></p>
      <a href="#galerie" class="btn">Voir la galerie</a>
    </div>
  </section>

  <section id="galerie" class="section">
    <h2>Galerie</h2>
    <div id="photosGrille" class="photos"></div>
  </section>

  <div id="lightbox" class="lightbox"><img id="lightboxImg" alt="Photo agrandie"></div>

  <section id="apropos" class="section apropos">
    <img id="aproposPhoto" alt="Portrait ML Prod">
    <div>
      <h2 id="aproposTitre"></h2>
      <p id="aproposTexte"></p>
    </div>
  </section>

  <section id="contact" class="section">
    <h2>Contact</h2>
    <form id="formContact" method="POST" class="form">
      <input type="hidden" name="_subject" value="Nouveau message – site ML Prod">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://mlprod.fr/merci.html">
      <input type="text" name="nom" placeholder="Vos prénoms" required>
      <input type="email" name="email" placeholder="Votre e-mail" required>
      <input type="date" name="date_mariage">
      <textarea name="message" rows="5" placeholder="Parlez-moi de votre mariage" required></textarea>
      <button type="submit" class="btn">Envoyer</button>
    </form>
    <p id="infosContact" class="infos"></p>
  </section>

  <footer>© ML Prod – Vidéaste de mariage</footer>
  <script src="app.js?v=5"></script>
</body>
</html>
